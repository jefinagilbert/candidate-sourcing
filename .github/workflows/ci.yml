name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: 📦 Install Dependencies (Yarn)
        run: yarn install --frozen-lockfile

      - name: 🔍 Typecheck Monorepo
        run: yarn typecheck

      - name: 🏗️ Build Backend & Frontend
        run: yarn build

      - name: 🧪 Run Unit & Sourcing Tests
        run: yarn test
